<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Шаблоны лендингов от Раи</title>
  
  <!-- ШАГ 0: Подключение SDK Telegram (всегда в head) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Tailwind CSS для стилей -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* Нативные цвета Telegram (автоподстройка под тему) */
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #000000);
      --hint: var(--tg-theme-hint-color, #999999);
      --button: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f1f1f1);
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px 16px 100px 16px; /* Отступ снизу для главной кнопки */
    }
    .card {
      background: var(--secondary-bg);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.1s;
    }
    .card:active { transform: scale(0.97); }
  </style>
</head>
<body>

  <!-- Шапка с приветствием -->
  <header class="mb-6">
    <h1 class="text-2xl font-bold">Привет, <span id="username">гость</span> 👋</h1>
    <p style="color: var(--hint)" class="text-sm mt-1">Премиум шаблоны лендингов</p>
  </header>
  
  <!-- Каталог шаблонов -->
  <section class="grid grid-cols-2 gap-4" id="catalog">
    <!-- Карточки генерируются через JS ниже -->
  </section>

  <!-- ШАГ 1, 2, 3: Логика Telegram (всегда в конце body) -->
  <script>
    // --- ШАГ 1: Инициализация ---
    const tg = window.Telegram.WebApp;
    tg.ready();          // Сообщаем Telegram, что приложение загрузилось
    tg.expand();         // Разворачиваем на весь экран

    // --- ШАГ 2: Данные пользователя ---
    const user = tg.initDataUnsafe?.user;
    if (user) {
      document.getElementById('username').textContent = user.first_name;
    }

    // --- ШАГ 3: Данные и кнопки ---
    // Замените @raya_designer на ваш реальный юзернейм в Telegram
    const MY_USERNAME = 'raya_designer'; 

    const templates = [
      { id: 1, title: 'SaaS Pro', price: 150, emoji: '🚀' },
      { id: 2, title: 'Agency', price: 200, emoji: '💼' },
      { id: 3, title: 'Portfolio', price: 100, emoji: '🎨' }
    ];

    const catalog = document.getElementById('catalog');
    
    templates.forEach(t => {
      const card = document.createElement('div');
      card.className = 'card p-4 cursor-pointer';
      card.innerHTML = `
        <div class="text-5xl mb-3 text-center">${t.emoji}</div>
        <div class="font-semibold text-sm">${t.title}</div>
        <div class="mt-2 flex justify-between items-center">
          <span class="text-xs font-bold px-2 py-1 rounded" style="background: var(--button); color: var(--button-text);">⭐ ${t.price}</span>
        </div>
      `;
      
      // При клике на карточку
      card.onclick = () => {
        tg.HapticFeedback.selectionChanged(); // Вибрация (тренд UX)
        
        // Настраиваем главную нижнюю кнопку Telegram
        tg.MainButton.setText(`Купить "${t.title}" за ⭐${t.price}`);
        tg.MainButton.show();
        
        // Обработка клика по главной кнопке
        tg.MainButton.onClick(() => {
          handlePurchase(t);
        });
      };
      
      catalog.appendChild(card);
    });

    // Логика покупки / сбора лида
    function handlePurchase(template) {
      tg.HapticFeedback.notificationOccurred('success');
      
      // ВАРИАНТ А: Сбор лида (открывает чат с вами с готовым текстом)
      const message = `Привет! Хочу купить шаблон "${template.title}" за ⭐${template.price}. Как оплатить?`;
      const link = `https://t.me/${MY_USERNAME}?text=${encodeURIComponent(message)}`;
      
      // Открываем чат
      tg.openTelegramLink(link);
      
      /* 
      // ВАРИАНТ Б: Реальная оплата Stars (раскомментировать, когда будет ссылка на инвойс от бота)
      // const invoiceUrl = "https://t.me/your_bot?start=pay_123"; // Эту ссылку должен давать ваш бот
      // tg.openInvoice(invoiceUrl, (status) => {
      //   if (status === 'paid') alert('Оплачено!');
      // });
      */
    }
  </script>
</body>
</html>
