<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой Лендинг</title>
  <!-- Подключаем скрипт Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: var(--tg-theme-button-color, #0088cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h1>Добро пожаловать! 👋</h1>
  <p>Здесь вы можете узнать больше о нашем продукте или услугах.</p>
  
  <a href="https://t.me/your_telegram_username" class="btn">Записаться / Связаться</a>

  <script>
    // Уведомляем Telegram, что приложение загрузилось
    Telegram.WebApp.ready();
    // Растягиваем приложение на всю высоту (опционально)
    Telegram.WebApp.expand();
  </script>
</body>
</html>
