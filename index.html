<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Портфолио Раи</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #000000);
      --hint: var(--tg-theme-hint-color, #999999);
      --button: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f1f1f1);
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px 16px 100px 16px;
    }
    .card {
      background: var(--secondary-bg);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      transition: transform 0.1s;
      cursor: pointer;
    }
    .card:active { transform: scale(0.97); }
    .card-emoji { font-size: 64px; margin-bottom: 12px; }
    
    .category-tab {
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .category-tab.active {
      background: var(--button);
      color: var(--button-text);
    }
    .category-tab:not(.active) {
      background: var(--secondary-bg);
      color: var(--hint);
    }
  </style>
</head>
<body>

  <header class="mb-4">
    <h1 class="text-2xl font-bold">Привет, <span id="username">гость</span> 👋</h1>
    <p style="color: var(--hint)" class="text-sm mt-1">Дизайн и лендинги</p>
  </header>

  <div class="flex gap-2 mb-6 overflow-x-auto pb-2" id="categoryTabs">
    <div class="category-tab active" data-category="landing">🎯 Landing</div>
    <div class="category-tab" data-category="snapshots"> Snapshots</div>
    <div class="category-tab" data-category="pitch">📊 Pitch Deck</div>
  </div>

  <section class="grid grid-cols-2 gap-4" id="catalog"></section>
