<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:-apple-system,sans-serif;padding:20px;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#000);margin:0}
.tab{display:inline-block;padding:10px 16px;margin:5px 5px 15px 0;border-radius:12px;background:var(--tg-theme-secondary-bg-color,#eee);cursor:pointer;font-weight:600}
.tab.active{background:var(--tg-theme-button-color,#2481cc);color:var(--tg-theme-button-text-color,#fff)}
.card{display:inline-block;width:45%;margin:2%;padding:20px 10px;border-radius:16px;background:var(--tg-theme-secondary-bg-color,#eee);text-align:center;cursor:pointer;vertical-align:top}
.card:active{opacity:0.7}
.emoji{font-size:48px}
.title{font-size:14px;font-weight:600;margin-top:8px}
</style>
</head>
<body>
<h2>Привет, <span id="name">гость</span> 👋</h2>
<p style="opacity:0.6">Дизайн и лендинги</p>
<div id="tabs"></div>
<div id="catalog"></div>
<script>
var tg=window.Telegram.WebApp;tg.ready();tg.expand();
var user=tg.initDataUnsafe.user;
if(user&&user.first_name)document.getElementById('name').innerText=user.first_name;
var items={landing:[{t:'Портфолио',e:''}],snapshots:[{t:'Fashion',e:'👗'},{t:'YouTube',e:'📺'}],pitch:[{t:'Запуск',e:'🚀'},{t:'Simple Pitch',e:''},{t:'Startup',e:'💡'}]};
var cats=[{id:'landing',n:'🎯 Landing'},{id:'snapshots',n:'📸 Snapshots'},{id:'pitch',n:'📊 Pitch Deck'}];
var cur='landing';
var tabsDiv=document.getElementById('tabs');
cats.forEach(function(c){var t=document.createElement('div');t.className='tab'+(c.id===cur?' active':'');t.innerText=c.n;t.onclick=function(){cur=c.id;draw();tg.MainButton.hide()};tabsDiv.appendChild(t)});
function draw(){document.getElementById('catalog').innerHTML='';items[cur].forEach(function(it){var c=document.createElement('div');c.className='card';c.innerHTML='<div class="emoji">'+it.e+'</div><div class="title">'+it.t+'</div>';c.onclick=function(){tg.HapticFeedback.selectionChanged();tg.MainButton.setText('Заказать "'+it.t+'"');tg.MainButton.show();tg.MainButton.onClick(function(){tg.openTelegramLink('t.me/rnovos?text='+encodeURIComponent('Привет! Хочу заказать "'+it.t+'". Расскажите подробнее.'))})};document.getElementById('catalog').appendChild(c)})}
draw();
</script>
</body>
</html>
