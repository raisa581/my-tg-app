<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Портфолио Раи</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #000000);
      --hint: var(--tg-theme-hint-color, #999999);
      --button: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #f1f1f1);
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px 16px 100px 16px;
    }
    .card {
      background: var(--secondary-bg);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.1s;
      cursor: pointer;
    }
    .card:active { transform: scale(0.97); }
    
    .category-tab {
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .category-tab.active {
      background: var(--button);
      color: var(--button-text);
    }
    .category-tab:not(.active) {
      background: var(--secondary-bg);
      color: var(--hint);
    }
  </style>
</head>
<body>

  <!-- Шапка -->
  <header class="mb-4">
    <h1 class="text-2xl font-bold">Привет, <span id="username">гость</span> 👋</h1>
    <p style="color: var(--hint)" class="text-sm mt-1">Дизайн и лендинги</p>
  </header>

  <!-- Переключатель категорий -->
  <div class="flex gap-2 mb-6 overflow-x-auto pb-2" id="categoryTabs">
    <div class="category-tab active" data-category="landing">🎯 Landing</div>
    <div class="category-tab" data-category="snapshots">📸 Snapshots</div>
    <div class="category-tab" data-category="pitch">📊 Pitch Deck</div>
  </div>

  <!-- Каталог -->
  <section class="grid grid-cols-2 gap-4" id="catalog"></section>

  <!-- JavaScript (Мышцы приложения) -->
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;
    if (user) {
      document.getElementById('username').textContent = user.first_name;
    }

    const MY_USERNAME = 'rnovos';

    // Шаблоны (цены убраны)
    const allTemplates = {
      landing: [
        { id: 3, title: 'Portfolio', emoji: '🎨', category: 'landing' }
      ],
      snapshots: [
        { id: 5, title: 'Instagram Post', emoji: '📱', category: 'snapshots' },
        { id: 6, title: 'Story Pack', emoji: '📲', category: 'snapshots' },
        { id: 7, title: 'Banner Set', emoji: '🎪', category: 'snapshots' }
      ],
      pitch: [
        { id: 8, title: 'Startup Pitch', emoji: '💡', category: 'pitch' },
        { id: 9, title: 'Investor Deck', emoji: '💰', category: 'pitch' },
        { id: 10, title: 'Product Launch', emoji: '🚀', category: 'pitch' }
      ]
    };

    let currentCategory = 'landing';
    const catalog = document.getElementById('catalog');
    const tabs = document.querySelectorAll('.category-tab');

    function renderCatalog(category) {
      catalog.innerHTML = '';
      const templates = allTemplates[category] || [];
      
      templates.forEach(t => {
        const card = document.createElement('div');
        card.className = 'card p-4';
        // Убрали блок с ценой
        card.innerHTML = `
          <div class="text-5xl mb-3 text-center">${t.emoji}</div>
          <div class="font-semibold text-sm">${t.title}</div>
        `;
        
        card.onclick = () => {
          tg.HapticFeedback.selectionChanged();
          tg.MainButton.setText(`Заказать "${t.title}"`);
          tg.MainButton.show();
          
          tg.MainButton.offClick();
          tg.MainButton.onClick(() => handleLead(t));
        };
        
        catalog.appendChild(card);
      });
    }

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tg.HapticFeedback.selectionChanged();
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentCategory = tab.dataset.category;
        renderCatalog(currentCategory);
        tg.MainButton.hide();
      });
    });

    function handleLead(template) {
      tg.HapticFeedback.notificationOccurred('success');
      const message = `Привет! Хочу заказать шаблон "${template.title}" (${getCategoryName(template.category)}). Расскажите подробнее.`;
      const link = `https://t.me/${MY_USERNAME}?text=${encodeURIComponent(message)}`;
      tg.openTelegramLink(link);
    }

    function getCategoryName(cat) {
      const names = { landing: 'Landing', snapshots: 'Snapshots', pitch: 'Pitch Deck' };
      return names[cat] || cat;
    }

    renderCatalog('landing');
  </script>
</body>
</html>
