<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Women's AI Pack</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #222222);
      margin: 0;
      padding: 24px 16px;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    p {
      font-size: 15px;
      line-height: 1.5;
      color: var(--tg-theme-hint-color, #666666);
      margin-bottom: 24px;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px 20px;
      background-color: var(--tg-theme-button-color, #0088cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 12px;
    }
    .btn-secondary {
      background-color: transparent;
      color: var(--tg-theme-button-color, #0088cc);
      border: 1px solid var(--tg-theme-button-color, #0088cc);
    }
  </style>
</head>
<body>
  <h1>Women's AI Pack
    👋</h1>
  <p>Добро пожаловать! Здесь вы найдете полезные материалы, гайды и анонсы по искусственному интеллекту.</p>
  
  <!-- Кнопка связи с вами -->
  <a href="https://t.me/rnovos" class="btn">💬 Связаться / Написать мне</a>

  <!-- Кнопка перехода в ваш канал -->
  <a href="https://t.me/womens_ai_pack" class="btn btn-secondary">📢 Перейти в канал</a>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  </script>
</body>
</html>
